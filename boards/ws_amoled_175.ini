[env:ws_amoled_175]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = dio

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM=1
    -D BACKLIGHT_PIN=-1
    ; AXP2101 PMIC on the board-wide I2C bus (SDA=15, SCL=14). Besides
    ; battery telemetry, Battery::begin() configures a real four-second PWR
    ; long-press shutdown. The AXP2101 cuts the power rails itself, so this
    ; still works if the application loop is stalled.
    -D BOARD_HAS_BATTERY=1
    -D BOARD_HAS_BAT_AXP2101=1
    -D AXP2101_I2C_SDA=15
    -D AXP2101_I2C_SCL=14
    -D BOARD_IS_WS_AMOLED_175=1
    -D BOARD_VARIANT=\"ws_amoled_175\"
    -D BOARD_NAME=\"Waveshare_ESP32-S3-Touch-AMOLED-1.75\"
    -D BOARD_PANEL=\"CO5300_466x466\"
    -D DISPLAY_466x466=1
    
src_filter =
    +<*>
    -<led.cpp>
    +<led_none.cpp>
    
lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino@1.6.5
    lewisxhe/XPowersLib@^0.3.3
